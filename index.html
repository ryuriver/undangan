<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Acara</title>
    <style>
        /* Ini adalah CSS untuk mengatur tampilan (warna, teks, posisi) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .kartu-undangan {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; }
        .nama-tamu {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }
        .tombol-rsvp {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #25D366; /* Warna khas WhatsApp */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Ini adalah isi konten yang akan tampil di layar -->
    <div class="kartu-undangan">
        <p>Kepada Yth.</p>
        <div class="nama-tamu" id="nama-tamu">Tamu Spesial</div>
        
        <h1>Undangan Syukuran</h1>
        <p>Kami mengundang Bapak/Ibu/Saudara/i untuk hadir pada acara kami yang akan diselenggarakan pada:</p>
        
        <p><strong>Hari/Tanggal:</strong> Sabtu, 25 Mei 2026<br>
           <strong>Waktu:</strong> 10.00 WIB - Selesai<br>
           <strong>Lokasi:</strong> Kediaman Kami</p>

        <!-- Tombol konfirmasi kehadiran via WhatsApp -->
        <a href="https://wa.me/6281234567890?text=Halo,%20saya%20mengonfirmasi%20akan%20Hadir%20pada%20acara%20syukuran." class="tombol-rsvp" target="_blank">Konfirmasi Kehadiran</a>
    </div>

    <!-- Ini adalah JavaScript untuk menangkap nama tamu dari Link -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        
        if (nama) {
            // Mengganti tanda + atau %20 menjadi spasi agar rapi
            document.getElementById('nama-tamu').innerText = nama.replace(/\+/g, ' ');
        }
    </script>

</body>
</html>
