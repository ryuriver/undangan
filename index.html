<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Ryu & Bhetri</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --gold: #c5a059;
            --cream: #ffffff;
            --bg-page: #f4f4f4;
            --bg-landing: #e2e7d8;
            --dark: #4a4a4a;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-page);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- STYLE PAMFLET UMUM --- */
        .pamflet {
            background-color: var(--cream);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            border: 15px solid white;
            outline: 1px solid var(--gold);
            outline-offset: -10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px 25px;
            box-sizing: border-box;
            position: relative;
        }

        /* --- SAMPUL --- */
        #sampul {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: var(--bg-landing);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .pamflet-cover {
            width: 100%; 
            height: 100vh; 
            max-width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #sampul h1 { font-family: 'Great Vibes', cursive; font-size: 55px; color: var(--gold); margin: 10px 0; }
        .sub-judul { letter-spacing: 4px; font-size: 11px; font-weight: 600; color: #8a8a8a; }

        .kotak-tamu {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
            width: 75%;
        }
        .kotak-tamu p { margin: 0; font-size: 11px; color: #999; text-transform: uppercase; }
        .kotak-tamu span { display: block; font-size: 22px; font-weight: bold; color: var(--dark); margin-top: 8px; }

        /* --- BUTTONS --- */
        .btn-aksi {
            display: inline-block;
            padding: 14px 35px;
            background-color: var(--dark);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-buka { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- ISI UNDANGAN --- */
        #isi-undangan {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }

        .pamflet-konten {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .judul-bagian { font-family: 'Great Vibes', cursive; font-size: 36px; color: var(--gold); margin-bottom: 20px; }
        hr.hias { border: 0; border-top: 1px solid var(--gold); width: 60px; margin: 25px auto; }

        .map-container { 
            width: 100%; height: 300px; margin: 20px 0; 
            border-radius: 10px; overflow: hidden; border: 1px solid #eee; 
        }

        .rekening-box {
            border: 1px dashed var(--gold); 
            padding: 20px; border-radius: 10px; 
            margin-bottom: 15px; width: 80%;
        }
    </style>
</head>
<body>

    <audio id="backsound" loop>
        <source src="https://drive.google.com/file/d/1m8-1nbC-GTQHKo3jnQ8YiieIeS1Xj6HB/view?usp=sharing" type="audio/mpeg">
    </audio>

    <div id="sampul">
        <div class="pamflet pamflet-cover">
            <div class="sub-judul">UNDANGAN PERNIKAHAN</div>
            <h1>Ryu & Bhetri</h1>
            <div class="kotak-tamu">
                <p>Kepada Yth. Bapak/Ibu/Sdr/i:</p>
                <span class="nama-tamu-display">Tamu Spesial</span>
            </div>
            <button class="btn-aksi btn-buka" onclick="bukaUndangan()">BUKA UNDANGAN</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        if (nama) {
            const elements = document.querySelectorAll('.nama-tamu-display');
            elements.forEach(el => el.innerText = nama.replace(/\+/g, ' '));
        }

        function bukaUndangan() {
            // FUNGSI UNTUK MEMUTAR AUDIO
            const audio = document.getElementById("backsound");
            audio.play().catch(error => console.log("Autoplay dicegah browser"));

            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }

            document.getElementById("sampul").style.transform = "translateY(-100%)";
            setTimeout(() => {
                document.getElementById("isi-undangan").style.display = "block";
                window.scrollTo(0,0);
                AOS.refresh();
            }, 600);
        }

        function salinTeks(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("Nomor rekening disalin!");
        }
    </script>
</body>
</html>
